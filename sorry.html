<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry 🫂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e0, #ffeef2);
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            color: #d6336c;
            font-size: 45px;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }

        .subtitle {
            color: #777;
            margin-bottom: 40px;
        }

        .sorry-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 1200px;
            margin: auto;
        }

        .sorry {
            color: #e75480;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);

            opacity: 0;
            animation: appear 1s ease forwards,
                       float 3s ease-in-out infinite;

            transition: transform 0.3s ease;
        }

        .sorry:hover {
            transform: scale(1.2) rotate(3deg);
            background: white;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .hug {
            position: fixed;
            bottom: -30px;
            font-size: 20px;
            animation: rise 5s linear infinite;
            pointer-events: none;
        }

        @keyframes rise {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>I'm Sorry Milady</h1>
        <p class="subtitle">1k nani ah bisag i count pa nimo... kay di man kaha enough ang isa ra.</p>

        <div class="sorry-container" id="sorryContainer"></div>
    </div>

    <script>
        const container = document.getElementById("sorryContainer");

        // Generate "I am sorry" 1,000 times
        for (let i = 1; i <= 1000; i++) {
            const text = document.createElement("div");

            text.className = "sorry";
            text.textContent = "I am sorry milady";

            // Slightly different animation timing for each one
            text.style.animationDelay =
                `${(i * 0.015)}s, ${(Math.random() * 3).toFixed(2)}s`;

            container.appendChild(text);
        }

        // Floating hugging emoji
        function createHug() {
            const hug = document.createElement("div");

            hug.className = "hug";
            hug.textContent = "🫂";

            hug.style.left = Math.random() * 100 + "vw";
            hug.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            hug.style.fontSize =
                (15 + Math.random() * 20) + "px";

            document.body.appendChild(hug);

            setTimeout(() => {
                hug.remove();
            }, 7000);
        }

        setInterval(createHug, 500);
    </script>

</body>
</html>
